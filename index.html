<meta name="description" content="SLchat — простой демо-мессенджер">
<title>SLchat</title>
<style>
  :root{
    --bg:#0e1621; --panel:#17212b; --panel2:#1e2730; --accent:#4ea3f7;
    --bubble-out:#4ea3f7; --bubble-in:#2b3945; --text:#e8edf2; --muted:#8a97a3;
    box-sizing:border-box;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100%;max-width:900px;margin:0 auto;overflow:hidden;}
  #sidebar{width:280px;min-width:220px;background:var(--panel);border-right:1px solid #0a0f15;display:flex;flex-direction:column;}
  #sidebar h1{font-size:18px;padding:16px;margin:0;border-bottom:1px solid #0a0f15;}
  .chat-item{display:flex;gap:10px;padding:12px 14px;cursor:pointer;align-items:center;}
  .chat-item:hover,.chat-item.active{background:var(--panel2);}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;flex-shrink:0;}
  .chat-meta{overflow:hidden;}
  .chat-name{font-weight:600;font-size:14px;}
  .chat-last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #main{flex:1;display:flex;flex-direction:column;background:var(--bg);}
  #chat-header{padding:14px 16px;border-bottom:1px solid #0a0f15;font-weight:600;background:var(--panel);}
  #messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .bubble{max-width:70%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4;}
  .bubble.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px;}
  .bubble.out{align-self:flex-end;background:var(--bubble-out);color:#fff;border-bottom-right-radius:4px;}
  .bubble time{display:block;font-size:10px;color:rgba(255,255,255,0.6);margin-top:4px;}
  #input-row{display:flex;gap:8px;padding:12px;border-top:1px solid #0a0f15;background:var(--panel);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
  #input-row input{flex:1;padding:10px 14px;border-radius:20px;border:none;background:var(--panel2);color:var(--text);font-size:14px;outline:none;}
  #input-row button{background:var(--accent);border:none;color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex-shrink:0;}
  #input-row button:active{opacity:0.8;}
  #back-btn{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 10px 4px 0;}
  @media(max-width:700px){
    #app{max-width:100%;}
    #sidebar{width:100%;min-width:0;}
    #main{position:fixed;inset:0;transform:translateX(100%);transition:transform 0.25s ease;background:var(--bg);}
    #app.chat-open #sidebar{display:none;}
    #app.chat-open #main{transform:translateX(0);}
    #back-btn{display:inline-block;}
  }
  body[data-theme="light"]{
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f4;
    --bubble-in:#e6e9ec; --text:#111417; --muted:#6b7480;
  }
  body[data-theme="light"] .bubble time{ color:rgba(0,0,0,0.4); }
  .theme-opt.selected, .color-opt.selected{ outline:2px solid var(--accent); }
  #credit{
    position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;gap:5px;
    font-size:10px;font-weight:500;letter-spacing:0.2px;
    color:var(--muted);background:var(--panel);
    padding:5px 10px;border-radius:20px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
    opacity:0.85;z-index:1;pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  #credit.hidden{opacity:0;transform:translateY(10px);}
  #credit .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .unread-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;margin-left:auto;flex-shrink:0;}
  .chat-item{position:relative;}
  #auth-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  #auth-box{width:300px;max-width:100%;background:var(--panel);border-radius:16px;padding:28px 24px;}
  #auth-box h1{font-size:22px;margin:0 0 4px;text-align:center;}
  #auth-box p{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px;}
  #auth-box input{width:100%;padding:12px 14px;border-radius:10px;border:none;background:var(--panel2);color:var(--text);font-size:14px;outline:none;margin-bottom:10px;}
  #auth-submit-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;}
  #auth-toggle{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);}
  #auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:none;}
  #auth-error{color:#f76e6e;font-size:12px;text-align:center;min-height:16px;margin-top:8px;}
</style>
</head>

// Чаты синхронизируются через Firebase: список чатов общий для всех,
// у кого открыто приложение — если кто-то добавит чат, он появится у всех.
// Приватные чаты (по коду) в этот общий список НЕ попадают — каждый
// добавляет их себе сам, введя тот же секретный код.
let chats = [];
const chatListRef = db.ref('chatList');
const messageListenersStarted = {};
let lastPublicList = [];

// Личные чаты с конкретным человеком — список тех, с кем я уже открывал
// переписку, хранится в этом браузере. Сам чат виден только двум участникам,
// потому что его id всегда собирается из id именно этих двух аккаунтов.
const PRIVATE_KEY = 'slchat_private_chats';
let privateChatsLocal = [];
try { privateChatsLocal = JSON.parse(localStorage.getItem(PRIVATE_KEY) || '[]'); } catch(e) {}
function savePrivateChats(){
  try { localStorage.setItem(PRIVATE_KEY, JSON.stringify(privateChatsLocal)); } catch(e) {}
}

function privateChatId(uidA, uidB){
  return 'dm_' + [uidA, uidB].sort().join('_');
}

let hasAutoOpened = false;
function rebuildChats(){
  const merged = lastPublicList.concat(privateChatsLocal);
  merged.forEach(item => {
    const existing = chats.find(c => c.id === item.id);
    item.messages = existing ? existing.messages : [];
    item.seedText = (defaultChats.find(d => d.id === item.id) || {}).messages?.[0];
  });
  chats = merged;
  chats.forEach(chat => {
    if(!messageListenersStarted[chat.id]){
      messageListenersStarted[chat.id] = true;
      listenToChat(chat);
    }
  });
  renderChatList();
  if(!hasAutoOpened && chats.length > 0 && window.innerWidth > 700){
    hasAutoOpened = true;
    openChat(chats[0].id);
  }
}

// Запускается только после успешного входа в аккаунт
function startApp(){
  chatListRef.once('value', snap => {
    if(!snap.exists()){
      // Если список чатов в базе ещё пуст — кладём туда стартовых друзей один раз
      defaultChats.forEach(c => {
        chatListRef.child(c.id).set({ id: c.id, name: c.name, avatar: c.avatar || null, createdAt: Date.now() });
      });
    }
  });
  chatListRef.on('value', snap => {
    const list = [];
    snap.forEach(child => { list.push(child.val()); });
    list.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    lastPublicList = list;
    rebuildChats();
  });
}

// Начать личный чат с конкретным человеком по его логину
function startPrivateChat(username, onError){
  const uname = username.trim().toLowerCase();
  if(!uname){ onError('Введи логин собеседника'); return; }
  db.ref('usernames/' + uname).once('value').then(snap => {
    if(!snap.exists()){ onError('Пользователь с таким логином не найден'); return; }
    const theirUid = snap.val();
    if(theirUid === myClientId){ onError('Это твой собственный логин'); return; }
    const id = privateChatId(myClientId, theirUid);
    if(!privateChatsLocal.find(c => c.id === id)){
      privateChatsLocal.push({ id, name: username, createdAt: Date.now() });
      savePrivateChats();
    }
    rebuildChats();
    document.getElementById('add-chat-modal').style.display = 'none';
    openChat(id);
  });
}

// Непрочитанные сообщения — считаем локально по времени последнего просмотра чата
const LAST_SEEN_KEY = 'slchat_last_seen';
let lastSeen = {};
try { lastSeen = JSON.parse(localStorage.getItem(LAST_SEEN_KEY) || '{}'); } catch(e) {}
function saveLastSeen(){ try { localStorage.setItem(LAST_SEEN_KEY, JSON.stringify(lastSeen)); } catch(e) {} }
function unreadCount(chat){
  const seenTs = lastSeen[chat.id] || 0;
  return chat.messages.filter(m => (m.ts||0) > seenTs && m.clientId !== myClientId).length;
}

// Уведомления в браузере — показываются для новых сообщений в чатах,
// которые сейчас не открыты (лучше всего работает, пока страница открыта)
let notifPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
function requestNotifPermission(){
  if(typeof Notification === 'undefined') return;
  Notification.requestPermission().then(p => {
    notifPermission = p;
    updateNotifBtn();
  });
}
function updateNotifBtn(){
  const btn = document.getElementById('notif-btn');
  if(!btn) return;
  if(notifPermission === 'granted') btn.textContent = '🔔 Уведомления включены';
  else if(notifPermission === 'denied') btn.textContent = '🔕 Уведомления заблокированы браузером';
  else btn.textContent = '🔔 Включить уведомления';
}

function listenToChat(chat){
  const ref = db.ref('chats/' + chat.id + '/messages');
  let firstLoad = true;
  ref.once('value', snap => {
    if(!snap.exists() && chat.seedText){
      // Если в базе ещё нет сообщений — кладём туда стартовое сообщение один раз
      ref.push({ text: chat.seedText.text, time: chat.seedText.time, clientId: 'seed', ts: Date.now() });
    }
  });
  ref.on('value', snap => {
    const msgs = [];
    snap.forEach(child => { msgs.push(child.val()); });
    msgs.sort((a,b) => (a.ts||0) - (b.ts||0));
    const prevLast = chat.messages[chat.messages.length - 1];
    chat.messages = msgs;
    const newLast = msgs[msgs.length - 1];

    // Показываем уведомление, если это НЕ первая загрузка, сообщение новое,
    // не наше собственное, и этот чат сейчас не открыт
    if(!firstLoad && newLast && newLast !== prevLast && newLast.clientId !== myClientId && activeChatId !== chat.id){
      if(notifPermission === 'granted'){
        try { new Notification(newLast.senderName || chat.name, { body: newLast.text, tag: chat.id }); } catch(e) {}
      }
    }
    firstLoad = false;

    if(activeChatId === chat.id){
      // Чат открыт прямо сейчас — сразу помечаем как прочитанный
      const lastMsg = msgs[msgs.length - 1];
      lastSeen[chat.id] = lastMsg ? (lastMsg.ts || Date.now()) : Date.now();
      saveLastSeen();
    }

    renderChatList();
    if(activeChatId === chat.id) renderMessages();
  });
}

let activeChatId = null;
let searchQuery = '';

// Настройки внешнего вида (тема + цвет акцента), тоже сохраняются в браузере
const SETTINGS_KEY = 'slchat_settings';
let settings = { theme: 'dark', accent: '#4ea3f7' };
try {
  const savedSettings = localStorage.getItem(SETTINGS_KEY);
  if (savedSettings) settings = JSON.parse(savedSettings);
} catch(e) {}

function applySettings(){
  document.body.setAttribute('data-theme', settings.theme);
  document.documentElement.style.setProperty('--accent', settings.accent);
  document.documentElement.style.setProperty('--bubble-out', settings.accent);
  document.querySelectorAll('.theme-opt').forEach(b => b.classList.toggle('selected', b.dataset.theme === settings.theme));
  document.querySelectorAll('.color-opt').forEach(b => b.classList.toggle('selected', b.dataset.color === settings.accent));
}

function saveSettings(){
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) {}
}

function initials(name){ return name.trim()[0].toUpperCase(); }

// Мой профиль — имя теперь берётся из аккаунта (при регистрации),
// аватарка хранится в общей базе, чтобы другие тоже её видели
let myProfile = { name: '', avatar: null };

function saveProfileAvatar(){
  if(myClientId) db.ref('users/' + myClientId + '/avatar').set(myProfile.avatar);
}

function applyProfileToUI(){
  document.getElementById('profile-name-input').value = myProfile.name;
  const preview = document.getElementById('profile-avatar-preview');
  const placeholder = document.getElementById('profile-avatar-placeholder');
  if(myProfile.avatar){
    preview.src = myProfile.avatar;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    preview.style.display = 'none';
    placeholder.style.display = 'flex';
    placeholder.textContent = initials(myProfile.name || 'Я');
  }
}

function renderChatList(){
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  const filtered = chats.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()));
  filtered.forEach(chat => {
    const last = chat.messages[chat.messages.length - 1];
    const div = document.createElement('div');
    div.className = 'chat-item' + (chat.id === activeChatId ? ' active' : '');
    const avatarHtml = chat.avatar
      ? `<img src="${chat.avatar}" class="avatar" style="object-fit:cover;" />`
      : `<div class="avatar">${initials(chat.name)}</div>`;
    const unread = unreadCount(chat);
    const badgeHtml = unread > 0 ? `<div class="unread-badge">${unread > 99 ? '99+' : unread}</div>` : '';
    div.innerHTML = `
      ${avatarHtml}
      <div class="chat-meta">
        <div class="chat-name">${chat.name}</div>
        <div class="chat-last">${last ? last.text : ''}</div>
      </div>
      ${badgeHtml}`;
    div.onclick = () => openChat(chat.id);
    list.appendChild(div);
  });
}

function openChat(id){
  activeChatId = id;
  const chat = chats.find(c => c.id === id);
  // Отмечаем чат прочитанным
  const lastMsg = chat.messages[chat.messages.length - 1];
  lastSeen[id] = lastMsg ? (lastMsg.ts || Date.now()) : Date.now();
  saveLastSeen();
  renderChatList();
  document.getElementById('chat-header-name').textContent = chat.name;
  const headerAvatar = document.getElementById('chat-header-avatar');
  if(chat.avatar){ headerAvatar.src = chat.avatar; headerAvatar.style.display = 'inline-block'; }
  else { headerAvatar.style.display = 'none'; }
  document.getElementById('app').classList.add('chat-open');
  renderMessages();
}

function closeChat(){
  document.getElementById('app').classList.remove('chat-open');
}

function renderMessages(){
  const box = document.getElementById('messages');
  const chat = chats.find(c => c.id === activeChatId);
  box.innerHTML = '';
  if(!chat) return;
  chat.messages.forEach(m => {
    const isMine = m.clientId === myClientId;
    const div = document.createElement('div');
    div.className = 'bubble ' + (isMine ? 'out' : 'in');
    const senderLabel = (!isMine && m.senderName) ? `<div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px;">${m.senderName}</div>` : '';
    div.innerHTML = `${senderLabel}${m.text}<time>${m.time}</time>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function sendMessage(){
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text || !activeChatId) return;
  const chat = chats.find(c => c.id === activeChatId);
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  db.ref('chats/' + chat.id + '/messages').push({
    text, time, clientId: myClientId, ts: Date.now(),
    senderName: myProfile.name || 'Аноним', senderAvatar: myProfile.avatar || null
  });
  input.value = '';
}

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderChatList();
});

document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('msg-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') sendMessage();
});

// Подпись внизу слева мешает при вводе сообщения — прячем её, пока печатаем
const creditEl = document.getElementById('credit');
const msgInputEl = document.getElementById('msg-input');
msgInputEl.addEventListener('focus', () => creditEl.classList.add('hidden'));
msgInputEl.addEventListener('blur', () => { if(!msgInputEl.value) creditEl.classList.remove('hidden'); });
msgInputEl.addEventListener('input', () => {
  creditEl.classList.toggle('hidden', msgInputEl.value.length > 0 || document.activeElement === msgInputEl);
});

// Профиль: смена аватарки — жмём на кружок или на ссылку "Сменить фото"
function openAvatarPicker(){ document.getElementById('profile-avatar-input').click(); }
document.getElementById('profile-avatar-btn').onclick = openAvatarPicker;
document.getElementById('profile-avatar-preview').onclick = openAvatarPicker;
document.getElementById('profile-avatar-placeholder').onclick = openAvatarPicker;

document.getElementById('profile-avatar-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      // Обрезаем фото под квадрат и уменьшаем — чтобы аватарка была лёгкой
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      myProfile.avatar = canvas.toDataURL('image/jpeg', 0.85);
      saveProfileAvatar();
      applyProfileToUI();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// Создание нового чата
document.getElementById('add-chat-btn').onclick = () => {
  document.getElementById('new-chat-name').value = '';
  document.getElementById('new-chat-partner').value = '';
  document.getElementById('new-chat-private').checked = false;
  document.getElementById('new-chat-partner').style.display = 'none';
  document.getElementById('new-chat-name').style.display = 'block';
  document.getElementById('add-chat-error').textContent = '';
  document.getElementById('add-chat-modal').style.display = 'flex';
};
document.getElementById('cancel-chat-btn').onclick = () => {
  document.getElementById('add-chat-modal').style.display = 'none';
};
document.getElementById('new-chat-private').addEventListener('change', e => {
  const isPriv = e.target.checked;
  document.getElementById('new-chat-partner').style.display = isPriv ? 'block' : 'none';
  document.getElementById('new-chat-name').style.display = isPriv ? 'none' : 'block';
});
document.getElementById('create-chat-btn').onclick = () => {
  const isPrivate = document.getElementById('new-chat-private').checked;
  const errorEl = document.getElementById('add-chat-error');
  errorEl.textContent = '';
  if(isPrivate){
    const partner = document.getElementById('new-chat-partner').value.trim();
    startPrivateChat(partner, msg => { errorEl.textContent = msg; });
  } else {
    const name = document.getElementById('new-chat-name').value.trim();
    if(!name) return;
    const newRef = chatListRef.push();
    newRef.set({ id: newRef.key, name, avatar: null, createdAt: Date.now() });
    document.getElementById('add-chat-modal').style.display = 'none';
  }
};
document.getElementById('new-chat-name').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('create-chat-btn').click();
});
document.getElementById('new-chat-partner').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('create-chat-btn').click();
});

document.getElementById('back-btn').onclick = closeChat;

function setupAppIcon(){
  const iconUrl = APP_ICON;

  let favicon = document.querySelector("link[rel~='icon']");
  if(!favicon){ favicon = document.createElement('link'); favicon.rel = 'icon'; document.head.appendChild(favicon); }
  favicon.href = iconUrl;

  let appleIcon = document.querySelector("link[rel='apple-touch-icon']");
  if(!appleIcon){ appleIcon = document.createElement('link'); appleIcon.rel = 'apple-touch-icon'; document.head.appendChild(appleIcon); }
  appleIcon.href = iconUrl;

  const manifest = {
    name: "SLchat", short_name: "SLchat", start_url: ".",
    display: "standalone", background_color: "#0e1621", theme_color: settings.accent,
    icons: [{ src: iconUrl, sizes: "512x512", type: "image/png" }]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  let manifestLink = document.querySelector("link[rel='manifest']");
  if(!manifestLink){ manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
  manifestLink.href = URL.createObjectURL(blob);
}
setupAppIcon();
applySettings();
document.getElementById('chat-header-name').textContent = 'Выбери чат';

// ===== Вход и регистрация =====
function usernameToEmail(u){
  return u.trim().toLowerCase().replace(/[^a-z0-9_.\-]/g,'_') + '@slchat.local';
}

let authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  const isLogin = mode === 'login';
  document.getElementById('auth-subtitle').textContent = isLogin ? 'Войди в свой аккаунт' : 'Создай новый аккаунт';
  document.getElementById('auth-submit-btn').textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('auth-toggle-text').textContent = isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
  document.getElementById('auth-toggle-link').textContent = isLogin ? 'Зарегистрироваться' : 'Войти';
  document.getElementById('auth-error').textContent = '';
}
document.getElementById('auth-toggle-link').onclick = () => {
  setAuthMode(authMode === 'login' ? 'register' : 'login');
};

function authErrorText(err){
  const code = err && err.code;
  if(code === 'auth/wrong-password' || code === 'auth/user-not-found' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') return 'Неверный логин или пароль';
  if(code === 'auth/email-already-in-use') return 'Этот логин уже занят';
  if(code === 'auth/weak-password') return 'Пароль слишком простой (минимум 6 символов)';
  if(code === 'auth/invalid-email') return 'Логин может содержать только буквы, цифры и подчёркивание';
  return 'Ошибка: ' + (err && err.message ? err.message : 'что-то пошло не так');
}

function submitAuth(){
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const errorEl = document.getElementById('auth-error');
  const submitBtn = document.getElementById('auth-submit-btn');
  errorEl.textContent = '';
  if(!username || !password){ errorEl.textContent = 'Заполни оба поля'; return; }
  if(password.length < 6){ errorEl.textContent = 'Пароль минимум 6 символов'; return; }
  const email = usernameToEmail(username);
  submitBtn.disabled = true;

  if(authMode === 'register'){
    const uname = username.toLowerCase();
    db.ref('usernames/' + uname).once('value').then(snap => {
      if(snap.exists()){
        errorEl.textContent = 'Это имя уже занято';
        submitBtn.disabled = false;
        return;
      }
      auth.createUserWithEmailAndPassword(email, password).then(cred => {
        const uid = cred.user.uid;
        db.ref('users/' + uid).set({ username, avatar: null });
        db.ref('usernames/' + uname).set(uid);
      }).catch(err => {
        errorEl.textContent = authErrorText(err);
        submitBtn.disabled = false;
      });
    });
  } else {
    auth.signInWithEmailAndPassword(email, password).catch(err => {
      errorEl.textContent = authErrorText(err);
      submitBtn.disabled = false;
    });
  }
}
document.getElementById('auth-submit-btn').onclick = submitAuth;
document.getElementById('auth-password').addEventListener('keydown', e => { if(e.key === 'Enter') submitAuth(); });
document.getElementById('auth-username').addEventListener('keydown', e => { if(e.key === 'Enter') submitAuth(); });

// Главный переключатель: показываем либо экран входа, либо само приложение
auth.onAuthStateChanged(user => {
  document.getElementById('auth-submit-btn').disabled = false;
  if(user){
    myClientId = user.uid;
    db.ref('users/' + user.uid).once('value').then(snap => {
      const data = snap.val() || {};
      myProfile.name = data.username || (user.email || '').split('@')[0];
      myProfile.avatar = data.avatar || null;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      startApp();
    });
  } else {
    myClientId = null;
    document.getElementById('auth-username').value = '';
    document.getElementById('auth-password').value = '';
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});
</script>
